name: CI -- Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  # ============================================================
  # Backend: Lint + Unit Tests + Phase 8 Evaluation Quality Gate
  # ============================================================
  backend-tests:
    name: Backend Tests & Evaluation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secops_user
          POSTGRES_PASSWORD: secops_password
          POSTGRES_DB: secops_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://secops_user:secops_password@localhost:5432/secops_db
      OPENAI_API_KEY: ""
      ABUSEIPDB_API_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # ---- Pytest unit & integration tests ----
      - name: Run pytest suite
        run: |
          pytest tests/ -v --tb=short --no-header             --junitxml=reports/pytest-results.xml
        env:
          PYTHONPATH: .

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: reports/pytest-results.xml

      # ---- Phase 8 Evaluation Quality Gate ----
      - name: Run Phase 8 Evaluation Suite
        id: eval_gate
        run: |
          python -m backend.evaluation.runner > reports/evaluation-report.txt 2>&1
          cat reports/evaluation-report.txt
        env:
          PYTHONPATH: .

      - name: Enforce evaluation quality thresholds
        run: |
          python - << 'PYEOF'
          import sys

          with open("reports/evaluation-report.txt") as f:
              report = f.read()

          def extract_metric(label, report):
              for line in report.splitlines():
                  if label in line:
                      parts = line.split(":")
                      if len(parts) >= 2:
                          val_str = parts[-1].strip().rstrip("%")
                          try:
                              return float(val_str)
                          except ValueError:
                              pass
              return None

          failures = []

          f1 = extract_metric("F1 Score", report)
          if f1 is None or f1 < 0.80:
              failures.append(f"F1 Score below threshold: {f1} < 0.80")

          recall = extract_metric("Recall", report)
          if recall is None or recall < 0.85:
              failures.append(f"Recall below threshold: {recall} < 0.85")

          floor_rate = extract_metric("Severity Floor Invariant Rate", report)
          if floor_rate is None or floor_rate < 100.0:
              failures.append(f"Severity Floor Invariant Rate below 100%: {floor_rate}")

          adv_rate = extract_metric("Prompt-Injection Defense Rate", report)
          if adv_rate is None or adv_rate < 90.0:
              failures.append(f"Prompt-Injection Defense Rate below 90%: {adv_rate}")

          fail_res = extract_metric("Failure Mode Resilience Rate", report)
          if fail_res is None or fail_res < 75.0:
              failures.append(f"Failure Mode Resilience Rate below 75%: {fail_res}")

          if failures:
              print("QUALITY GATE FAILED:")
              for f in failures:
                  print(f"  - {f}")
              sys.exit(1)
          else:
              print("QUALITY GATE PASSED -- All thresholds met.")
          PYEOF
        env:
          PYTHONPATH: .

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: reports/evaluation-report.txt

  # ============================================================
  # Frontend: Type-check + Build
  # ============================================================
  frontend-build:
    name: Frontend Type-Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --silent

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================================
  # Docker: Build images (validate Dockerfiles compile)
  # ============================================================
  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ backend-tests, frontend-build ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: secops-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: secops-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Summary badge job -- only runs on main push
  # ============================================================
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [ backend-tests, frontend-build, docker-build ]
    if: always()
    steps:
      - name: Check status of all jobs
        run: |
          if [[ "${{ needs.backend-tests.result }}" != "success" ||                 "${{ needs.frontend-build.result }}" != "success" ||                 "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All CI jobs passed successfully."
