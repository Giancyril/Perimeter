apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: {{ .Release.Name }}
type: Opaque
stringData:
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
  abuseipdb-api-key: {{ .Values.secrets.abuseipdbApiKey | quote }}
  virustotal-api-key: {{ .Values.secrets.virustotalApiKey | quote }}
  slack-webhook-url: {{ .Values.secrets.slackWebhookUrl | quote }}
