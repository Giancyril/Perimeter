version: "3.9"

# ============================================================
# Autonomous SecOps Agent -- Full Production Stack
# Services: backend, frontend, postgres, redis
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL 16 -- Persistent incident / action store
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: secops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secops_password}
      POSTGRES_DB: ${POSTGRES_DB:-secops_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secops_user} -d ${POSTGRES_DB:-secops_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------
  # Redis 7 -- Async task queue / rate-limit / cache
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: secops-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-secops_redis_pass} --save 60 1 --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secops_redis_pass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------
  # Backend -- FastAPI / LangGraph Autonomous SOC Agent
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: secops-backend:latest
    container_name: secops-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PORT: 8000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-secops_user}:${POSTGRES_PASSWORD:-secops_password}@postgres:5432/${POSTGRES_DB:-secops_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-secops_redis_pass}@redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      WAZUH_API_URL: ${WAZUH_API_URL:-}
      WAZUH_API_USER: ${WAZUH_API_USER:-}
      WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD:-}
      WAZUH_VERIFY_SSL: ${WAZUH_VERIFY_SSL:-false}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    volumes:
      - backend_logs:/app/logs

  # ----------------------------------------------------------
  # Frontend -- React (Vite) served via Nginx
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    image: secops-frontend:latest
    container_name: secops-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

# ----------------------------------------------------------
# Named volumes for persistent data
# ----------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
